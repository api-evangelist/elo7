name: elo7
description: Elo7 was a Brazilian online marketplace for handmade, customized, and creative products
  — frequently described as "the Etsy of Brazil." Founded in 2008 and headquartered in Sao Paulo, it
  connected independent artisans and small makers with buyers across Brazil for party supplies, decor,
  crafts, and personalized goods. Etsy acquired Elo7 in July 2021 for roughly USD 217 million, then sold
  it to Brazilian firm Enjoei S.A. in July 2023, after which the marketplace was wound down and stopped
  accepting new orders. Elo7 published no public developer API or OpenAPI; its GitHub organization holds
  only small internal frontend (AMD) utility libraries. This profile entered the API Evangelist network
  as an Insight Partners portfolio lead and is enriched here with the real, honest surface that remains.
